
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Our Love Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Heart floating effect */
  .heart {
    position: absolute;
    font-size: 20px;
    opacity: 0.8;
    animation: floatUp 6s linear infinite;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity:0.8; }
    100% { transform: translateY(-600px) scale(1.2); opacity:0; }
  }

  /* Countdown box */
  .countdown-box {
    position: relative;
    width: 350px;
    max-width: 90%;
    background: #fff;
    border: 2px solid #f28ab2;
    border-radius: 20px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    z-index: 1;
  }

  .countdown-box h1 {
    margin-bottom: 16px;
    font-size: 1.8rem;
    color: #d63482;
  }

  .timer {
    font-size: 1.2rem;
    margin-bottom: 16px;
    color: #333;
  }

  /* Bubble inside countdown box */
  .bubble {
    position: absolute;
    bottom: 10px;
    border-radius: 20px;
    color: #fff;
    font-weight: bold;
    white-space: normal; 
    word-wrap: break-word;
    opacity: 0.9;
    pointer-events: none;
    animation: riseBubble linear forwards;
    padding: 8px 16px;
    max-width: 80%;
    text-align: center;
  }

  @keyframes riseBubble {
    0% { transform: translateY(0) scale(1); opacity:1; }
    100% { transform: translateY(-250px) scale(1.05); opacity:0; }
  }

  iframe {
    width: 100%;
    height: 80px;
    border: none;
    margin-top: 16px;
    border-radius: 12px;
  }
</style>
</head>
<body>

<!-- Heart effect container -->
<div id="hearts"></div>

<div class="countdown-box">
  <h1>Our Love 💖</h1>
  <div class="timer" id="timer">Loading...</div>
</div>

<!-- Spotify embed -->
<iframe src="https://open.spotify.com/embed/track/3W7KHojYGgYaoX9ogKO9hU" allow="encrypted-media"></iframe>

<script>
  // Countdown
  const startDate = new Date("2025-11-03T00:00:00"); // ganti tanggal jadianmu
  const timerEl = document.getElementById("timer");

  function updateTime() {
    const now = new Date();
    const diffMs = now - startDate;

    if (diffMs < 0) {
      timerEl.innerText = "Belum jadian";
      return;
    }

    let diff = Math.floor(diffMs / 1000);
    const days = Math.floor(diff / 86400); diff %= 86400;
    const hours = Math.floor(diff / 3600); diff %= 3600;
    const minutes = Math.floor(diff / 60); 
    const seconds = diff % 60;

    timerEl.innerText = `${days} hari ${hours} jam ${minutes} menit ${seconds} detik`;
  }

  updateTime();
  setInterval(updateTime, 1000);

  // Bubble messages
  const messages = [
    "Just know that I would die for you – The Weeknd, Die For You 💖",
    "You keep me open, I'm so devoted – SZA feat. Travis Scott, Open Arms 💕",
    "Nothing’s gonna change my love for you – Classic Hit 💗",
    "I just can't say I don't love you – The Weeknd, Die For You ❤️",
    "Open arms, open arms – SZA feat. Travis Scott, Open Arms 💞",
    "Maybe you didn’t mean to say 'I love you' – Billie Eilish, I Love You 💘",
    "All of me loves all of you – John Legend, All of Me 💛",
    "Just let me adore you – Harry Styles, Adore You 💖",
    "You were Romeo, I was a scarlet letter – Taylor Swift, Love Story 💗",
    "I can't help falling in love with you – Elvis Presley, Can’t Help Falling in Love ❤️"
  ];

  const countdownBox = document.querySelector('.countdown-box');
  const activeBubbles = [];
  const maxBubbles = 5;
  const positions = [10, 50, 80]; // % horizontal
  let posIndex = 0;

  function createBubble() {
    if(activeBubbles.length >= maxBubbles) return;

    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    bubble.innerText = messages[Math.floor(Math.random() * messages.length)];

    const size = 14 + Math.random() * 4;
    bubble.style.fontSize = size + 'px';
    bubble.style.padding = (size/2) + 'px ' + size + 'px';

    bubble.style.background = `hsl(${Math.random()*360}, 60%, 60%)`;

    // horizontal position
    const pos = positions[posIndex % positions.length];
    posIndex++;
    bubble.style.left = pos + '%';
    if(pos === 50) bubble.style.transform = 'translateX(-50%)';

    countdownBox.appendChild(bubble);
    activeBubbles.push(bubble);

    const duration = 8 + Math.random() * 4;
    bubble.style.animationDuration = duration + 's';

    setTimeout(() => {
      bubble.remove();
      const index = activeBubbles.indexOf(bubble);
      if(index > -1) activeBubbles.splice(index,1);
    }, duration*1000);

    setTimeout(createBubble, 1200);
  }

  createBubble();

  // Floating hearts in background
  const heartsContainer = document.getElementById('hearts');
  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerText = '💖';
    heart.style.left = Math.random()*100 + 'vw';
    heart.style.fontSize = 12 + Math.random()*20 + 'px';
    heartsContainer.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }

  setInterval(createHeart, 800);

</script>
</body>
</html>
