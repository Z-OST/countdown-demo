<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Our Love Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin:0; padding:0; height:100vh;
    display:flex; justify-content:center; align-items:center;
    background:#ffffff; font-family:Arial, Helvetica, sans-serif;
    overflow:hidden; position:relative;
  }

  /* Hearts floating in background */
  .heart {
    position:absolute; font-size:20px; opacity:0.8;
    animation: floatUp 6s linear infinite;
    pointer-events:none;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity:0.8; }
    100% { transform: translateY(-600px) scale(1.2); opacity:0; }
  }

  /* Countdown box */
  .countdown-box {
    position: relative; width: 350px; max-width:90%;
    background:#fff; border:2px solid #f28ab2; border-radius:20px;
    padding:24px; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,0.1);
    z-index:1;
  }

  .countdown-box h1 { margin-bottom:16px; font-size:1.8rem; color:#d63482; }
  .timer { font-size:1.2rem; margin-bottom:16px; color:#333; }
  .changing-text {
    font-size:1rem; color:#555; margin:12px 0; min-height:24px;
  }

  /* Bubble from bottom */
  .bubble {
    position:absolute; border-radius:20px; color:#fff;
    font-weight:bold; white-space:normal; word-wrap:break-word;
    opacity:0.9; pointer-events:none; animation: riseBubble linear forwards;
    padding:8px 16px; max-width:80%; text-align:center;
  }

  @keyframes riseBubble {
    0% { transform: translateY(0) scale(1); opacity:1; }
    100% { transform: translateY(-250px) scale(1.05); opacity:0; }
  }

  iframe {
    width:100%; height:80px; border:none; margin-top:16px; border-radius:12px;
  }
</style>
</head>
<body>

<div id="hearts"></div>

<div class="countdown-box">
  <h1>Our Love 💖</h1>
  <div class="timer" id="timer">Loading...</div>
  <div class="changing-text" id="changingText">...</div>
</div>

<iframe src="https://open.spotify.com/embed/track/3W7KHojYGgYaoX9ogKO9hU" allow="encrypted-media"></iframe>

<script>
  // Countdown
  const startDate = new Date("2025-11-03T00:00:00");
  const timerEl = document.getElementById("timer");

  function updateTime() {
    const now = new Date();
    const diffMs = now - startDate;
    if(diffMs <0){ timerEl.innerText="Belum jadian"; return;}
    let diff=Math.floor(diffMs/1000);
    const days=Math.floor(diff/86400); diff%=86400;
    const hours=Math.floor(diff/3600); diff%=3600;
    const minutes=Math.floor(diff/60);
    const seconds=diff%60;
    timerEl.innerText=`${days} hari ${hours} jam ${minutes} menit ${seconds} detik`;
  }
  updateTime();
  setInterval(updateTime,1000);

  // Changing text inside box
  const changingText = document.getElementById("changingText");
  const messages = [
    "I love you sayang ❤️",
    "Makasih udah mau sama aku 💕",
    "Sayangku, kamu segalanya 🌹",
    "Aku bahagia selalu bersamamu 💖",
    "Kamu membuatku tersenyum setiap hari 😘",
    "Aku selalu pilih kamu 💗",
    "Cintaku cuma untukmu 💛",
    "Kamu inspirasiku setiap saat 💞"
  ];
  function changeText(){
    changingText.innerText = messages[Math.floor(Math.random()*messages.length)];
    setTimeout(changeText,2500);
  }
  changeText();

  // Bubble from bottom
  const countdownBox = document.querySelector('.countdown-box');
  const bubbleMessages = [
    "Just know that I would die for you – The Weeknd, Die For You 💖",
    "You keep me open, I'm so devoted – SZA feat. Travis Scott, Open Arms 💕",
    "Nothing’s gonna change my love for you – Classic Hit 💗",
    "All of me loves all of you – John Legend, All of Me 💛",
    "Open arms, open arms – SZA feat. Travis Scott 💞",
    "Maybe you didn’t mean to say 'I love you' – Billie Eilish 💘",
    "Just let me adore you – Harry Styles, Adore You 💖",
    "You were Romeo, I was a scarlet letter – Taylor Swift, Love Story 💗"
  ];
  const activeBubbles = [];
  const positions=[10,80];
  let posIndex=0;

  function createBubble(){
    if(activeBubbles.length>=2) return;
    const bubble=document.createElement('div');
    bubble.classList.add('bubble');
    bubble.innerText=bubbleMessages[Math.floor(Math.random()*bubbleMessages.length)];
    const size=14+Math.random()*4;
    bubble.style.fontSize=size+'px';
    bubble.style.padding=(size/2)+'px '+size+'px';
    bubble.style.background=`hsl(${Math.random()*360}, 60%, 60%)`;

    const pos=positions[posIndex%positions.length];
    posIndex++;
    bubble.style.left=pos+'%';
    if(pos===50) bubble.style.transform='translateX(-50%)';
    bubble.style.bottom='10px';

    countdownBox.appendChild(bubble);
    activeBubbles.push(bubble);

    const duration=8+Math.random()*4;
    bubble.style.animationDuration=duration+'s';

    setTimeout(()=>{
      bubble.remove();
      const index=activeBubbles.indexOf(bubble);
      if(index>-1) activeBubbles.splice(index,1);
    }, duration*1000);

    setTimeout(createBubble,1800);
  }
  createBubble();

  // Floating hearts in background
  const heartsContainer=document.getElementById('hearts');
  function createHeart(){
    const heart=document.createElement('div');
    heart.className='heart';
    heart.innerText='💖';
    heart.style.left=Math.random()*100+'vw';
    heart.style.fontSize=12+Math.random()*20+'px';
    heartsContainer.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
  }
  setInterval(createHeart,700);

</script>
</body>
</html>
