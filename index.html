<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Sentence Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f6f5f2;
      color: #1e1e1e;
      padding: 40px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 18px;
      cursor: pointer;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: transform .3s ease, box-shadow .3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
    }

    .card p {
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.6;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(246,245,242,0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .quote-box {
      max-width: 700px;
      padding: 60px 40px;
      text-align: center;
      animation: fadeScale .5s ease;
    }

    .quote-box p {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      line-height: 1.6;
    }

    .watermark {
      margin-top: 40px;
      font-size: 12px;
      opacity: 0.4;
    }

    @keyframes fadeScale {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 600px) {
      .quote-box p {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div class="gallery">
    <div class="card"><p>Aku bertahan bukan karena kuat, tapi karena belum selesai.</p></div>
    <div class="card"><p>Ada rasa yang gak butuh dibalas, cuma dimengerti.</p></div>
    <div class="card"><p>Tenang bukan berarti sembuh, hanya belajar diam.</p></div>
    <div class="card"><p>Beberapa hal patah supaya kita berhenti menggenggam.</p></div>
    <div class="card"><p>Aku capek, tapi masih pengen hidup.</p></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="quote-box">
      <p id="bigQuote"></p>
      <div class="watermark">sentence gallery · 2026</div>
    </div>
  </div>

  <script>
    const cards = document.querySelectorAll('.card');
    const overlay = document.getElementById('overlay');
    const bigQuote = document.getElementById('bigQuote');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        bigQuote.textContent = card.innerText;
        overlay.classList.add('active');
      });
    });

    overlay.addEventListener('click', () => {
      overlay.classList.remove('active');
    });
  </script>

</body>
</html>
