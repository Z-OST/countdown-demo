
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Jadian Romantis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        .container {
            background: rgba(0,0,0,0.5);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            max-width: 350px;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            font-size: 2.2em;
            margin-bottom: 20px;
        }

        #countdown {
            font-size: 1.5em;
            margin: 20px 0;
        }

        img {
            width: 100%;
            border-radius: 15px;
            margin: 20px 0;
        }

        iframe {
            border-radius: 15px;
            width: 100%;
            height: 80px;
        }

        /* Animasi hati */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            transform: rotate(-45deg);
            animation: float 4s linear infinite;
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            border-radius: 50%;
        }
        .heart::before { top: -10px; left: 0; }
        .heart::after { top: 0; left: 10px; }

        @keyframes float {
            0% { transform: translateY(0) rotate(-45deg); opacity: 1; }
            100% { transform: translateY(-500px) rotate(-45deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💖 Countdown Jadian 💖</h1>
        <div id="countdown"></div>

        <div class="photo">
            <img src="https://www.instagram.com/p/CONTOH_IMAGE/" alt="Foto Romantis">
        </div>

        <div class="music">
            <h2>Lagu Romantis</h2>
            <iframe src="https://open.spotify.com/embed/track/SONG_ID" 
                    frameborder="0" allowtransparency="true" allow="encrypted-media">
            </iframe>
        </div>
    </div>

    <script>
        // Tanggal jadian (YYYY, M-1, D)
        const jadian = new Date(2024, 0, 15); // contoh: 15 Januari 2024

        function updateCountdown() {
            const now = new Date();
            const diff = now - jadian;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("countdown").innerHTML = `
                ${days} Hari<br>
                ${hours} Jam<br>
                ${minutes} Menit<br>
                ${seconds} Detik
            `;
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Buat animasi hati
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.animationDuration = 2 + Math.random() * 3 + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);
    </script>
</body>
</html>
