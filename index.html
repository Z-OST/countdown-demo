
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💲 | Quick Trade ROI</title>
<style>
body { font-family:Arial,sans-serif; padding:20px; background:#fff; color:#111; }
h1 { text-align:center; margin-bottom:20px; }
label { display:block; margin-top:10px; font-weight:bold; }
input { width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:5px; }
.results { white-space:pre-line; font-weight:bold; margin-top:10px; }
</style>
</head>
<body>
<h1>💲 Quick Trade ROI</h1>

<label>Saldo Akun (USD)</label>
<input type="number" step="0.01" id="balance">

<label>Jumlah Investasi (USD)</label>
<input type="number" step="0.01" id="invest">

<label>Harga Beli per Unit (USD)</label>
<input type="number" step="0.0001" id="price">

<label>Harga Jual per Unit (USD)</label>
<input type="number" step="0.0001" id="target">

<div class="results" id="results"></div>

<script>
const balanceInput = document.getElementById('balance');
const investInput = document.getElementById('invest');
const priceInput = document.getElementById('price');
const targetInput = document.getElementById('target');
const resultsDiv = document.getElementById('results');

function calculate() {
  const balance = parseFloat(balanceInput.value);
  const invest = parseFloat(investInput.value);
  const price = parseFloat(priceInput.value);
  const target = parseFloat(targetInput.value);

  if ([balance, invest, price, target].some(v => isNaN(v))) {
    resultsDiv.innerText = '';
    return;
  }

  // === RUMUS PERSIS SESUAI LO ===
  const labaBersih = target - price;
  const ROI = (labaBersih / price) * 100;
  const totalPendapatan = ROI + invest;
  const keuntunganInvestasi = totalPendapatan - invest;

  resultsDiv.innerText =
`Laba Bersih           : $${labaBersih.toFixed(4)}
ROI (%)                : ${ROI.toFixed(2)}%
Total Pendapatan       : $${totalPendapatan.toFixed(4)}
Keuntungan Investasi   : $${keuntunganInvestasi.toFixed(4)}`;
}

// update langsung saat input
[balanceInput, investInput, priceInput, targetInput].forEach(inp => inp.addEventListener('input', calculate));
</script>
</body>
</html>
