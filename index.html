
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Our Love Bubbles Final</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .bubble {
      position: fixed;
      bottom: 0;
      border-radius: 20px;
      color: #fff;
      font-weight: bold;
      white-space: normal; 
      word-wrap: break-word;
      opacity: 0.9;
      pointer-events: none;
      animation: rise linear forwards;
      padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      max-width: 80%;
      text-align: center;
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-550px) scale(1.05); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Our Love Bubbles 💖</h1>
  </div>

  <script>
    const messages = [
      "Just know that I would die for you – The Weeknd, Die For You 💖",
      "You keep me open, I'm so devoted – SZA feat. Travis Scott, Open Arms 💕",
      "Nothing’s gonna change my love for you – Classic Hit 💗",
      "I just can't say I don't love you – The Weeknd, Die For You ❤️",
      "Open arms, open arms – SZA feat. Travis Scott, Open Arms 💞",
      "Maybe you didn’t mean to say 'I love you' – Billie Eilish, I Love You 💘",
      "All of me loves all of you – John Legend, All of Me 💛",
      "Just let me adore you – Harry Styles, Adore You 💖",
      "You were Romeo, I was a scarlet letter – Taylor Swift, Love Story 💗",
      "I can't help falling in love with you – Elvis Presley, Can’t Help Falling in Love ❤️"
    ];

    const positions = ['left', 'center', 'right']; 
    const activeBubbles = [];
    const maxBubbles = 10;
    let posIndex = 0;

    function createBubble() {
      if (activeBubbles.length >= maxBubbles) return;

      const bubble = document.createElement('div');
      bubble.classList.add('bubble');

      bubble.innerText = messages[Math.floor(Math.random() * messages.length)];

      const size = 14 + Math.random() * 6;
      bubble.style.fontSize = size + 'px';
      bubble.style.padding = (size/2) + 'px ' + size + 'px';

      const hue = Math.random() * 360;
      bubble.style.background = `hsl(${hue}, 70%, 60%)`;

      const pos = positions[posIndex % positions.length];
      posIndex++;
      if(pos === 'left') bubble.style.left = '10%';
      else if(pos === 'center') bubble.style.left = '50%';
      else bubble.style.left = '80%';
      if(pos === 'center') bubble.style.transform = 'translateX(-50%)';

      const duration = 10 + Math.random() * 5;
      bubble.style.animationDuration = duration + 's';

      document.body.appendChild(bubble);
      activeBubbles.push(bubble);

      setTimeout(() => {
        bubble.remove();
        const index = activeBubbles.indexOf(bubble);
        if(index > -1) activeBubbles.splice(index,1);
      }, duration * 1000);
    }

    setInterval(createBubble, 1500);
  </script>
</body>
</html>
