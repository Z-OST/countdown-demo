<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Art Quote Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f6f5f2;color:#1e1e1e;padding:40px;}
h1#galleryTitle{font-family:'Playfair Display',serif;font-size:48px;margin-bottom:20px;}
#categorySelect{padding:12px 16px;font-size:16px;border-radius:12px;border:none;background:#e0e0e0;font-family:'Playfair Display',serif;margin-bottom:40px;cursor:pointer;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;opacity:0;pointer-events:none;}
.card{background:#ffffff;padding:30px;border-radius:18px;cursor:pointer;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(40px);transition:transform .5s ease,opacity .5s ease,box-shadow .3s;}
.card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 20px 50px rgba(0,0,0,0.1);}
.card p{font-family:'Playfair Display',serif;font-size:16px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px;}
.downloadBtn{padding:6px 12px;border:none;border-radius:8px;background:#1e1e1e;color:#fff;font-family:'Inter',sans-serif;font-size:14px;cursor:pointer;transition:background .3s;}
.downloadBtn:hover{background:#333;}
.overlay{position:fixed;inset:0;background:#ffffff;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease;padding:20px;}
.overlay.active{opacity:1;pointer-events:auto;}
.quote-box{max-width:800px;padding:60px 50px;text-align:center;animation:fadeScale .5s ease;overflow-y:auto;max-height:90vh;}
.quote-box p{font-family:'Playfair Display',serif;font-size:32px;line-height:1.6;color:#1e1e1e;}
.watermark{margin-top:40px;font-size:12px;opacity:0.3;font-family:'Inter',sans-serif;}
@keyframes fadeScale{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
@media(max-width:600px){h1#galleryTitle{font-size:32px;}#categorySelect{font-size:14px;} .quote-box p{font-size:24px;}}
</style>
</head>
<body>

<h1 id="galleryTitle">Art Quote Gallery</h1>

<select id="categorySelect">
  <option value="">Pilih Kategori</option>
  <option value="Love">Love</option>
  <option value="Heartbreak">Heartbreak</option>
  <option value="Friendship">Friendship</option>
</select>

<div class="gallery" id="gallery"></div>

<div class="overlay" id="overlay">
  <div class="quote-box">
    <p id="bigQuote"></p>
    <div class="watermark">Art Quote Gallery · 2026</div>
  </div>
</div>

<script>
const quotes = {
  Love:[
    "Di dunia yang penuh kebohongan, bahkan hati dan cinta saja diperhitungkan...",
    "Aku selalu berharap kalau cinta aku tidak pernah habis buat kamu...",
    "Aku bertahan bukan karena kuat, tapi karena belum selesai.",
    "Ada rasa yang gak butuh dibalas, cuma dimengerti.",
    "Tenang bukan berarti sembuh, hanya belajar diam.",
    "Cinta bukan soal memiliki, tapi memahami.",
    "Jangan menunggu bahagia, ciptakan bahagia.",
    "Cinta datang tanpa alasan, tapi pergi juga tanpa alasan.",
    "Kita tak perlu sempurna, cukup mencoba.",
    "Senyum itu sederhana tapi sangat berarti.",
    "Tetaplah berani walau dunia menekan.",
    "Cinta sejati terlihat dari perhatian kecil."
  ],
  Heartbreak:[
    "Dongeng dengan akhir yang tidak jelas...",
    "Aku capek, tapi masih pengen hidup.",
    "Hidup kadang berat...",
    "Jangan takut jatuh...",
    "Kadang diam adalah jawaban terbaik."
  ],
  Friendship:[
    "Beberapa hal patah supaya kita berhenti menggenggam.",
    "Persahabatan adalah harta yang tidak ternilai.",
    "Berhenti menyesal, mulai dari sekarang.",
    "Berani berbeda adalah kekuatan terbesar.",
    "Kepercayaan dibangun, bukan dipaksakan."
  ]
};

const gallery = document.getElementById('gallery');
const overlay = document.getElementById('overlay');
const bigQuote = document.getElementById('bigQuote');
const categorySelect = document.getElementById('categorySelect');

const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.style.opacity='1';
      entry.target.style.transform='translateY(0)';
    } else {
      entry.target.style.opacity='0';
      entry.target.style.transform='translateY(40px)';
    }
  });
},{threshold:0.2});

// Render grid quotes dengan tombol download PNG
function renderQuotes(category){
  gallery.innerHTML='';
  gallery.style.opacity='1';
  gallery.style.pointerEvents='auto';
  quotes[category].forEach((q,i)=>{
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<p>${q}</p><button class="downloadBtn">Download PNG</button>`;
    div.style.transitionDelay = `${i*0.1}s`;
    gallery.appendChild(div);
    observer.observe(div);

    // klik card untuk overlay
    div.querySelector('p').addEventListener('click',()=>{bigQuote.textContent=q; overlay.classList.add('active');});

    // klik download button -> generate PNG
    div.querySelector('.downloadBtn').addEventListener('click',(e)=>{
      e.stopPropagation();
      const canvas = document.createElement('canvas');
      const width = 800;
      const height = 400;
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');

      // background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0,0,width,height);

      // text
      ctx.fillStyle = '#1e1e1e';
      ctx.font = '28px "Playfair Display"';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      // wrap text
      const words = q.split(' ');
      let line = '';
      let lines = [];
      const maxWidth = width - 80;
      for(let n=0;n<words.length;n++){
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if(metrics.width > maxWidth && n>0){
          lines.push(line);
          line = words[n] + ' ';
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      // draw lines
      const lineHeight = 36;
      const startY = (height - lines.length*lineHeight)/2 + lineHeight/2;
      lines.forEach((l,i)=>ctx.fillText(l.trim(), width/2, startY + i*lineHeight));

      // watermark
      ctx.font = '16px Inter';
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillText('Art Quote Gallery · 2026', width/2, height - 30);

      const link = document.createElement('a');
      link.download = 'quote.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  });
}

// Event combo box
categorySelect.addEventListener('change',()=>{
  const cat = categorySelect.value;
  if(cat) renderQuotes(cat);
});

// awal grid hidden
gallery.style.opacity='0';
gallery.style.pointerEvents='none';

// klik overlay close
overlay.addEventListener('click',()=>overlay.classList.remove('active'));
</script>

</body>
</html>
