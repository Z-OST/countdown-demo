<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Quotes</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: #1c1c1c;
      padding: 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }

    .card:hover {
      transform: scale(1.05);
      background: #2a2a2a;
    }

    /* MODAL */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      max-width: 80%;
      text-align: center;
      font-size: 24px;
      animation: pop .4s ease;
    }

    @keyframes pop {
      from {
        transform: scale(.7);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

<div class="grid">
  <div class="card" onclick="openQuote(this)">
    Aku selalu berharap cinta aku nggak habis.
  </div>
  <div class="card" onclick="openQuote(this)">
    Selama aku cinta, aku bakal berusaha.
  </div>
  <div class="card" onclick="openQuote(this)">
    Kalau mati rasa, aku nggak bisa janji.
  </div>
</div>

<div class="overlay" id="overlay" onclick="closeQuote()">
  <div class="modal" id="modalText"></div>
</div>

<script>
  function openQuote(el) {
    document.getElementById('modalText').innerText = el.innerText;
    document.getElementById('overlay').classList.add('active');
  }

  function closeQuote() {
    document.getElementById('overlay').classList.remove('active');
  }
</script>

</body>
</html>
