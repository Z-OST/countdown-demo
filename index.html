
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Mark Joe Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    margin:0; padding:0; height:100vh;
    display:flex; justify-content:center; align-items:center;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    font-family: 'Arial', sans-serif; overflow:hidden; position:relative;
    color: #fff;
  }

  /* Floating particles */
  .particle {
    position:absolute; border-radius:50%;
    background: rgba(255,255,255,0.2);
    animation: float 10s linear infinite;
    pointer-events:none;
  }

  @keyframes float {
    0% { transform: translateY(0) scale(1); opacity:0.6; }
    100% { transform: translateY(-700px) scale(1.2); opacity:0; }
  }

  .portfolio-box {
    position: relative; width: 350px; max-width:90%;
    background: rgba(255,255,255,0.05); border-radius:20px;
    padding:30px; text-align:center; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    backdrop-filter: blur(12px); z-index:1;
  }

  .portfolio-box img {
    width:100px; height:100px; border-radius:50%; margin-bottom:16px;
    border:2px solid rgba(255,255,255,0.5);
  }

  h1 { margin:8px 0; font-size:2rem; }
  p { font-size:1rem; margin:4px 0; color: #ddd; }

  .changing-text {
    margin-top:12px; font-weight:bold; color:#f8c291; min-height:24px;
  }

  .btn-contact {
    margin-top:16px;
    background:#f8c291; color:#1f1c2c; font-weight:bold;
  }
</style>
</head>
<body>
<div id="particles"></div>

<div class="portfolio-box">
  <img src="https://i.pravatar.cc/150?img=32" alt="Profile">
  <h1>Mark Joe</h1>
  <p>Gen Z Developer & Music Lover</p>
  <div class="changing-text" id="changingText"></div>
  <a href="mailto:markjoe@example.com" class="btn btn-contact">Contact Me</a>
</div>

<script>
  // Floating particles
  const particlesContainer = document.getElementById('particles');
  function createParticle(){
    const p = document.createElement('div');
    p.className='particle';
    const size = 5 + Math.random()*12;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = Math.random()*100+'vw';
    particlesContainer.appendChild(p);
    setTimeout(()=>p.remove(),10000);
  }
  setInterval(createParticle,400);

  // Changing text
  const changingText = document.getElementById('changingText');
  const messages = [
    "Frontend Developer 💻",
    "UI/UX Enthusiast 🎨",
    "Music Lover 🎧",
    "Always Learning 🌱",
    "Open for Projects 🚀"
  ];
  function changeText(){
    changingText.innerText = messages[Math.floor(Math.random()*messages.length)];
    setTimeout(changeText,2500);
  }
  changeText();
</script>
</body>
</html>
