<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Art Quote Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f6f5f2;color:#1e1e1e;padding:40px;transition:background .3s, color .3s;}
.dark-mode{background:#1e1e1e;color:#f6f5f2;}
h1#galleryTitle{font-family:'Playfair Display',serif;font-size:48px;margin-bottom:20px;}
#controls{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:40px;align-items:center;}
#categorySelect,#searchInput,#modeToggle{padding:12px 16px;font-size:16px;border-radius:12px;border:none;background:#e0e0e0;font-family:'Playfair Display',serif;cursor:pointer;transition:background .3s,color .3s;}
#categorySelect:hover,#searchInput:hover,#modeToggle:hover{background:#1e1e1e;color:#fff;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;opacity:1;}
.card{background:#ffffff;padding:30px;border-radius:18px;cursor:pointer;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(40px);transition:transform .5s ease,opacity .5s ease, box-shadow .3s, filter .3s;}
.card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 20px 50px rgba(0,0,0,0.1);}
.card p{font-family:'Playfair Display',serif;font-size:16px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;filter:blur(1px);transition:filter .3s;}
.card.show p{filter:blur(0);}
.overlay{position:fixed;inset:0;background:#ffffff;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease;padding:20px;}
.overlay.active{opacity:1;pointer-events:auto;}
.quote-box{max-width:800px;padding:60px 50px;text-align:center;animation:fadeScale .5s ease;overflow-y:auto;max-height:90vh;}
.quote-box p{font-family:'Playfair Display',serif;font-size:32px;line-height:1.6;color:#1e1e1e;}
.downloadBtn, .copyBtn{margin-top:20px;padding:10px 20px;border:none;border-radius:12px;font-family:'Inter',sans-serif;cursor:pointer;background:#e0e0e0;transition:background .3s,color .3s;font-size:14px;}
.downloadBtn:hover, .copyBtn:hover{background:#1e1e1e;color:#fff;}
.watermark{margin-top:20px;font-size:12px;opacity:0.3;font-family:'Inter',sans-serif;}
@keyframes fadeScale{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
@media(max-width:600px){h1#galleryTitle{font-size:32px;}#categorySelect,#searchInput,#modeToggle{font-size:14px;padding:10px 12px;} .quote-box p{font-size:24px;}}
</style>
</head>
<body>

<h1 id="galleryTitle">Art Quote Gallery</h1>

<div id="controls">
  <select id="categorySelect">
    <option value="">Semua Kategori</option>
    <option value="Love">Love</option>
    <option value="Heartbreak">Heartbreak</option>
    <option value="Friendship">Friendship</option>
  </select>
  <input type="text" id="searchInput" placeholder="Cari quote...">
  <button id="modeToggle">🌞</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="overlay" id="overlay">
  <div class="quote-box">
    <p id="bigQuote"></p>
    <button class="copyBtn">Copy Quote</button>
    <button class="downloadBtn">Download PNG</button>
    <div class="watermark">Art Quote Gallery · 2026</div>
  </div>
</div>

<script>
const quotes = {
  Love:[
    "Di dunia yang penuh kebohongan, bahkan hati dan cinta saja diperhitungkan...",
    "Aku selalu berharap kalau cinta aku tidak pernah habis buat kamu...",
    "Aku bertahan bukan karena kuat, tapi karena belum selesai.",
    "Ada rasa yang gak butuh dibalas, cuma dimengerti.",
    "Tenang bukan berarti sembuh, hanya belajar diam.",
    "Cinta bukan soal memiliki, tapi memahami.",
    "Jangan menunggu bahagia, ciptakan bahagia.",
    "Cinta datang tanpa alasan, tapi pergi juga tanpa alasan.",
    "Kita tak perlu sempurna, cukup mencoba.",
    "Senyum itu sederhana tapi sangat berarti.",
    "Tetaplah berani walau dunia menekan.",
    "Cinta sejati terlihat dari perhatian kecil."
  ],
  Heartbreak:[
    "Dongeng dengan akhir yang tidak jelas...",
    "Aku capek, tapi masih pengen hidup.",
    "Hidup kadang berat...",
    "Jangan takut jatuh...",
    "Kadang diam adalah jawaban terbaik."
  ],
  Friendship:[
    "Beberapa hal patah supaya kita berhenti menggenggam.",
    "Persahabatan adalah harta yang tidak ternilai.",
    "Berhenti menyesal, mulai dari sekarang.",
    "Berani berbeda adalah kekuatan terbesar.",
    "Kepercayaan dibangun, bukan dipaksakan."
  ]
};

const gallery = document.getElementById('gallery');
const overlay = document.getElementById('overlay');
const bigQuote = document.getElementById('bigQuote');
const categorySelect = document.getElementById('categorySelect');
const searchInput = document.getElementById('searchInput');
const modeToggle = document.getElementById('modeToggle');

let currentQuotes = [];

// Intersection Observer untuk animasi lazy load
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.style.opacity='1';
      entry.target.classList.add('show');
      entry.target.style.transform='translateY(0)';
    } else {
      entry.target.classList.remove('show');
      entry.target.style.opacity='0';
      entry.target.style.transform='translateY(40px)';
    }
  });
},{threshold:0.2});

// Render quotes
function renderQuotes(list){
  gallery.innerHTML='';
  gallery.style.opacity='1';
  gallery.style.pointerEvents='auto';
  list.forEach((q,i)=>{
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<p>${q}</p>`;
    div.style.transitionDelay = `${i*0.05}s`;
    gallery.appendChild(div);
    observer.observe(div);
    div.addEventListener('click',()=>{showOverlay(q);});
  });
}

// Overlay
function showOverlay(q){
  bigQuote.textContent = q;
  overlay.classList.add('active');
}

// Copy & download
document.querySelector('.copyBtn').addEventListener('click',()=>{
  navigator.clipboard.writeText(bigQuote.textContent);
  alert('Quote disalin!');
});
document.querySelector('.downloadBtn').addEventListener('click',()=>{
  import('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').then(html2canvas=>{
    html2canvas.default(document.querySelector('.quote-box')).then(canvas=>{
      const link = document.createElement('a');
      link.download = 'quote.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  });
});

// Filter & search
function updateDisplay(){
  let filtered = currentQuotes;
  const cat = categorySelect.value;
  if(cat) filtered = filtered.filter(q=>quotes[cat].includes(q));
  const keyword = searchInput.value.toLowerCase();
  if(keyword) filtered = filtered.filter(q=>q.toLowerCase().includes(keyword));
  renderQuotes(filtered);
}

categorySelect.addEventListener('change',()=>updateDisplay());
searchInput.addEventListener('input',()=>updateDisplay());

// Light/Dark mode
modeToggle.addEventListener('click',()=>{
  document.body.classList.toggle('dark-mode');
  modeToggle.textContent = document.body.classList.contains('dark-mode') ? '🌙' : '🌞';
});

// Initial load: gabung semua quote
currentQuotes = [...quotes.Love, ...quotes.Heartbreak, ...quotes.Friendship];
renderQuotes(currentQuotes);

// Klik overlay close
overlay.addEventListener('click',()=>overlay.classList.remove('active'));
</script>

</body>
</html>
