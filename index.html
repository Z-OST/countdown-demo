
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond 💎 | Quick Trading Calc</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#fff; font-family:Arial,sans-serif; padding:20px; color:#111; }
h1 { text-align:center; margin-bottom:20px; font-weight:bold; color:#333; }
.card { background:#f8f9fa; border-radius:15px; padding:20px; max-width:500px; margin:0 auto; box-shadow:0 5px 15px rgba(0,0,0,0.08); }
.card label { font-weight:bold; margin-top:10px; display:block; }
input { margin-bottom:10px; width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; }
input:focus { border-color:#3498db; outline:none; }
.results { white-space:pre-line; font-weight:bold; margin-top:10px; font-size:1rem; }
</style>
</head>
<body>
<div class="container">
<h1>Diamond 💎</h1>
<div class="card">
  <label for="price">Harga Beli per Unit (USD)</label>
  <input type="number" id="price" placeholder="Contoh: 10">

  <label for="amount">Jumlah Uang yang Ingin Investasi (USD)</label>
  <input type="number" id="amount" placeholder="Contoh: 100">

  <label for="balance">Saldo Akun (USD)</label>
  <input type="number" id="balance" placeholder="Contoh: 500">

  <label for="risk">Risk % per Trade</label>
  <input type="number" id="risk" placeholder="Contoh: 2">

  <label for="target">Target Harga Jual per Unit (USD)</label>
  <input type="number" id="target" placeholder="Contoh: 12">

  <div class="results"></div>
</div>
</div>

<script>
const fee = 0.001; // biaya trading

const priceInput = document.getElementById('price');
const amountInput = document.getElementById('amount');
const balanceInput = document.getElementById('balance');
const riskInput = document.getElementById('risk');
const targetInput = document.getElementById('target');
const resultsDiv = document.querySelector('.results');

function calculate(){
  const price = parseFloat(priceInput.value);
  const invest = parseFloat(amountInput.value);
  const balance = parseFloat(balanceInput.value);
  const risk = parseFloat(riskInput.value);
  const target = parseFloat(targetInput.value);

  if([price, invest, balance, risk, target].some(v => isNaN(v))) {
    resultsDiv.innerText='';
    return;
  }

  // Hitung jumlah unit yang bisa dibeli
  const units = invest / price;

  const totalBuy = price * units;
  const totalSell = target * units;
  const profit = (totalSell - totalBuy)*(1-fee);
  const profitPercent = ((totalSell - totalBuy)/totalBuy)*100;
  const maxLoss = balance*(risk/100);
  const positionSize = maxLoss / Math.abs(price - target);

  resultsDiv.innerText =
`Jumlah Unit        : ${units.toFixed(4)}
Total Beli         : $${totalBuy.toFixed(2)}
Target Jual        : $${totalSell.toFixed(2)}
Profit/Loss        : $${profit.toFixed(2)} (${profitPercent.toFixed(2)}%)
Max Position Size   : $${(positionSize*price).toFixed(2)} sesuai risk`;

  resultsDiv.style.color = profit>=0 ? '#27ae60' : '#c0392b';
}

// Update langsung tiap input berubah
[priceInput, amountInput, balanceInput, riskInput, targetInput].forEach(inp => {
  inp.addEventListener('input', calculate);
});
</script>
</body>
</html>
