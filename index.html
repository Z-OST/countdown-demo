
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Our Love Bubbles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .bubble {
      position: fixed;
      bottom: 0;
      border-radius: 20px;
      color: #fff;
      font-weight: bold;
      white-space: nowrap;
      opacity: 0.9;
      pointer-events: none;
      animation: rise linear forwards;
      padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-500px) scale(1.1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Our Love Bubbles 💖</h1>
  </div>

  <script>
    const messages = [
      "Aku sayang kamu 💕",
      "Selamanya kita 😘",
      "Kamu spesial 🌸",
      "Cinta kita abadi ❤️",
      "Kamu membuatku bahagia 😊",
      "Kamu segalanya 🌹"
    ];

    const activeBubbles = [];
    const maxBubbles = 15; // jumlah bubble maksimal di layar
    const bubbleSpacing = 60; // minimal jarak horizontal antar bubble

    function createBubble() {
      if (activeBubbles.length >= maxBubbles) return;

      const bubble = document.createElement('div');
      bubble.classList.add('bubble');

      // pilih teks random
      bubble.innerText = messages[Math.floor(Math.random() * messages.length)];

      // ukuran font random
      const size = 14 + Math.random() * 8;
      bubble.style.fontSize = size + 'px';
      bubble.style.padding = (size/2) + 'px ' + size + 'px';

      // warna random
      const hue = Math.random() * 360;
      bubble.style.background = `hsl(${hue}, 70%, 60%)`;

      // posisi horizontal
      let left;
      let tries = 0;
      do {
        left = Math.random() * (window.innerWidth - 100);
        tries++;
      } while (activeBubbles.some(b => Math.abs(b.left - left) < bubbleSpacing) && tries < 20);
      bubble.style.left = left + 'px';
      bubble.left = left; // simpan posisi untuk pengecekan jarak

      // durasi animasi berbeda-beda
      const duration = 5 + Math.random() * 3;
      bubble.style.animationDuration = duration + 's';

      document.body.appendChild(bubble);
      activeBubbles.push(bubble);

      // hapus bubble setelah animasi selesai
      setTimeout(() => {
        bubble.remove();
        const index = activeBubbles.indexOf(bubble);
        if (index > -1) activeBubbles.splice(index, 1);
      }, duration * 1000);
    }

    // buat bubble tiap 800ms → lebih rapi
    setInterval(createBubble, 800);
  </script>
</body>
</html>
