<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Art Quote Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f6f5f2;color:#1e1e1e;padding:40px;transition:background .3s, color .3s;}
h1#galleryTitle{font-family:'Playfair Display',serif;font-size:48px;margin-bottom:20px;}
#controls{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:40px;align-items:center;}
#categorySelect,#searchInput,#modeToggle{padding:12px 16px;font-size:16px;border-radius:12px;border:none;background:#e0e0e0;font-family:'Playfair Display',serif;cursor:pointer;transition:background .3s,color .3s;}
#categorySelect:focus,#searchInput:focus{outline:none;}
#modeToggle{display:flex;align-items:center;justify-content:center;}
#modeToggle span{margin-left:8px;font-size:20px;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;opacity:1;pointer-events:auto;}
.card{background:#ffffff;padding:30px;border-radius:18px;cursor:pointer;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;transform:translateY(40px);transition:transform .5s ease,opacity .5s ease,box-shadow .3s;}
.card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 20px 50px rgba(0,0,0,0.1);}
.card.blur{filter:blur(2px);opacity:.7;}
.card p{font-family:'Playfair Display',serif;font-size:16px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;}
.favorite{position:absolute;top:10px;right:10px;font-size:20px;cursor:pointer;transition:color .3s;}
.favorite.active{color:#ff5252;}
.overlay{position:fixed;inset:0;background:rgba(255,255,255,0.95);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease;padding:20px;}
.overlay.active{opacity:1;pointer-events:auto;}
.quote-box{max-width:800px;padding:60px 50px;text-align:center;animation:fadeScale .5s ease;overflow-y:auto;max-height:90vh;position:relative;}
.quote-box p{font-family:'Playfair Display',serif;font-size:32px;line-height:1.6;color:#1e1e1e;}
.watermark{margin-top:40px;font-size:12px;opacity:0.3;font-family:'Inter',sans-serif;}
@keyframes fadeScale{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
body.dark{background:#1e1e1e;color:#f6f5f2;}
body.dark .card{background:#2a2a2a;color:#f6f5f2;}
body.dark #categorySelect,#searchInput{background:#2a2a2a;color:#f6f5f2;}
body.dark .overlay{background:rgba(30,30,30,0.95);}
body.dark .quote-box p{color:#f6f5f2;}
@media(max-width:600px){h1#galleryTitle{font-size:32px;}#categorySelect,#searchInput,#modeToggle{font-size:14px;} .quote-box p{font-size:24px;}}
</style>
</head>
<body>

<h1 id="galleryTitle">Art Quote Gallery</h1>

<div id="controls">
  <select id="categorySelect">
    <option value="">Semua Kategori</option>
    <option value="Love">Love</option>
    <option value="Heartbreak">Heartbreak</option>
    <option value="Friendship">Friendship</option>
  </select>
  <input type="text" id="searchInput" placeholder="Cari quote...">
  <button id="modeToggle">🌞 <span>Mode</span></button>
</div>

<div class="gallery" id="gallery"></div>

<div class="overlay" id="overlay">
  <div class="quote-box">
    <p id="bigQuote"></p>
    <div class="watermark">Art Quote Gallery · 2026</div>
  </div>
</div>

<script>
const quotes = {
  Love:[
    "Di dunia yang penuh kebohongan, bahkan hati dan cinta saja diperhitungkan...",
    "Aku selalu berharap kalau cinta aku tidak pernah habis buat kamu...",
    "Aku bertahan bukan karena kuat, tapi karena belum selesai.",
    "Ada rasa yang gak butuh dibalas, cuma dimengerti.",
    "Tenang bukan berarti sembuh, hanya belajar diam.",
    "Cinta bukan soal memiliki, tapi memahami.",
    "Jangan menunggu bahagia, ciptakan bahagia.",
    "Cinta datang tanpa alasan, tapi pergi juga tanpa alasan.",
    "Kita tak perlu sempurna, cukup mencoba.",
    "Senyum itu sederhana tapi sangat berarti.",
    "Tetaplah berani walau dunia menekan.",
    "Cinta sejati terlihat dari perhatian kecil."
  ],
  Heartbreak:[
    "Dongeng dengan akhir yang tidak jelas...",
    "Aku capek, tapi masih pengen hidup.",
    "Hidup kadang berat...",
    "Jangan takut jatuh...",
    "Kadang diam adalah jawaban terbaik."
  ],
  Friendship:[
    "Beberapa hal patah supaya kita berhenti menggenggam.",
    "Persahabatan adalah harta yang tidak ternilai.",
    "Berhenti menyesal, mulai dari sekarang.",
    "Berani berbeda adalah kekuatan terbesar.",
    "Kepercayaan dibangun, bukan dipaksakan."
  ]
};

const gallery = document.getElementById('gallery');
const overlay = document.getElementById('overlay');
const bigQuote = document.getElementById('bigQuote');
const categorySelect = document.getElementById('categorySelect');
const searchInput = document.getElementById('searchInput');
const modeToggle = document.getElementById('modeToggle');

let favorites = JSON.parse(localStorage.getItem('favorites')||'[]');
let currentCategory = "";
let currentSearch = "";

// Intersection Observer
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.style.opacity='1';
      entry.target.style.transform='translateY(0)';
    }
  });
},{threshold:0.2});

function renderQuotes(category="", search=""){
  gallery.innerHTML='';
  const allQuotes = [];
  for(const cat in quotes){
    quotes[cat].forEach(q=>{
      allQuotes.push({cat,q});
    });
  }
  let filtered = allQuotes;
  if(category) filtered = filtered.filter(x=>x.cat===category);
  if(search) filtered = filtered.filter(x=>x.q.toLowerCase().includes(search.toLowerCase()));
  filtered.forEach((item,i)=>{
    const div = document.createElement('div');
    div.className='card';
    if(!category && !search) div.classList.add('blur');
    div.innerHTML = `<p>${item.q}</p><div class="favorite ${favorites.includes(item.q)?'active':''}">❤</div>`;
    div.style.transitionDelay=`${i*0.05}s`;
    gallery.appendChild(div);
    observer.observe(div);
    div.querySelector('.favorite').addEventListener('click',(e)=>{
      e.stopPropagation();
      if(favorites.includes(item.q)){
        favorites=favorites.filter(f=>f!==item.q);
        div.querySelector('.favorite').classList.remove('active');
      }else{
        favorites.push(item.q);
        div.querySelector('.favorite').classList.add('active');
      }
      localStorage.setItem('favorites',JSON.stringify(favorites));
    });
    div.addEventListener('click',()=>{bigQuote.textContent=item.q; overlay.classList.add('active');});
  });
}

// Event handlers
categorySelect.addEventListener('change',()=>{currentCategory=categorySelect.value; renderQuotes(currentCategory,currentSearch);});
searchInput.addEventListener('input',()=>{currentSearch=searchInput.value; renderQuotes(currentCategory,currentSearch);});
modeToggle.addEventListener('click',()=>{document.body.classList.toggle('dark');});

// Initial render semua blur
renderQuotes();
overlay.addEventListener('click',()=>overlay.classList.remove('active'));
</script>

</body>
</html>
