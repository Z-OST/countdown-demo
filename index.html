
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Trading Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { font-family: Arial,sans-serif; background:#0f0f0f; color:#fff; padding:20px; }
.container { max-width:700px; margin:auto; }
.card { background: rgba(255,255,255,0.05); border-radius:15px; padding:20px; margin-bottom:20px; }
input, select { margin-bottom:12px; }
#results { white-space:pre-line; font-weight:bold; color:#f8c291; }
</style>
</head>
<body>
<div class="container">
  <h1 class="text-center mb-4">Crypto Dashboard Sultan 💎</h1>
  <div class="card">
    <label>Coin:</label>
    <select id="coin">
      <option value="bitcoin">Bitcoin (BTC)</option>
      <option value="ethereum">Ethereum (ETH)</option>
      <option value="bnb">BNB</option>
      <option value="cardano">Cardano (ADA)</option>
      <option value="dogecoin">Dogecoin (DOGE)</option>
    </select>
    <input type="number" id="amount" class="form-control" placeholder="Jumlah Koin">
    <input type="number" id="balance" class="form-control" placeholder="Saldo akun (USD)">
    <input type="number" id="risk" class="form-control" placeholder="Risk % per trade">
    <input type="number" id="target" class="form-control" placeholder="Target harga jual (USD)">
  </div>

  <div class="card">
    <button class="btn btn-warning w-100" onclick="calculate()">Hitung Profit & Risk</button>
    <div id="price" class="mt-2"></div>
    <div id="results" class="mt-2"></div>
  </div>
</div>

<script>
const coinSelect = document.getElementById('coin');
const amountInput = document.getElementById('amount');
const balanceInput = document.getElementById('balance');
const riskInput = document.getElementById('risk');
const targetInput = document.getElementById('target');
const resultsDiv = document.getElementById('results');
const priceDiv = document.getElementById('price');
const fee = 0.001; // 0.1% fee

async function getPrice(coin){
  try {
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coin}&vs_currencies=usd`);
    const data = await res.json();
    return data[coin]?.usd || 0;
  } catch(e){
    return 0;
  }
}

async function calculate(){
  const coin = coinSelect.value;
  const amount = parseFloat(amountInput.value);
  const balance = parseFloat(balanceInput.value);
  const risk = parseFloat(riskInput.value);
  const target = parseFloat(targetInput.value);

  if(isNaN(amount) || isNaN(balance) || isNaN(risk) || isNaN(target)){
    resultsDiv.innerText = "Isi semua field!";
    return;
  }

  const currentPrice = await getPrice(coin);
  priceDiv.innerText = `Harga real-time ${coin.toUpperCase()}: $${currentPrice}`;

  const totalBuy = currentPrice * amount;
  const totalSell = target * amount;
  const profit = (totalSell - totalBuy) * (1 - fee);
  const profitPercent = ((totalSell - totalBuy)/totalBuy)*100;
  const maxLoss = balance * (risk/100);
  const positionSize = maxLoss / Math.abs(currentPrice - target);

  resultsDiv.innerText = 
`Total Beli       : $${totalBuy.toFixed(2)}
Total Jual       : $${totalSell.toFixed(2)}
Profit/Loss      : $${profit.toFixed(2)} (${profitPercent.toFixed(2)}%)
Max Position Size : ${positionSize.toFixed(4)} koin sesuai risk`;
}
</script>
</body>
</html>
