<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Crypto Dashboard Final</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { background:#ffffff; color:#111; font-family: Arial,sans-serif; padding:20px; transition: background 0.3s, color 0.3s;}
h1 { text-align:center; margin-bottom:20px; color:#333; }
.card { background: rgba(0,0,0,0.05); border-radius:15px; padding:20px; margin-bottom:20px; color:#111; transition: background 0.3s, color 0.3s;}
input { margin-bottom:10px; }
.results { white-space:pre-line; font-weight:bold; color:#d35400; }
.chart-container { height:100px; margin-top:10px; }
#themeToggle { display:block; margin:0 auto 20px; }
</style>
</head>
<body>
<div class="container">
<h1>Pro Crypto Dashboard Final 💎</h1>
<button id="themeToggle" class="btn btn-secondary">Ganti Tema</button>
<div class="row" id="coins-container"></div>
</div>

<script>
const coins = [
  {id:"bitcoin", symbol:"BTC"},
  {id:"ethereum", symbol:"ETH"},
  {id:"bnb", symbol:"BNB"},
  {id:"cardano", symbol:"ADA"},
  {id:"dogecoin", symbol:"DOGE"}
];

const fee = 0.001;
const coinsContainer = document.getElementById('coins-container');
const charts = {};
let isDark = false;

// Buat card per coin
function createCoinCard(coin){
  const cardDiv = document.createElement('div');
  cardDiv.classList.add('col-md-6','col-lg-4');
  cardDiv.innerHTML = `
    <div class="card">
      <h4>${coin.symbol.toUpperCase()}</h4>
      <input type="number" class="form-control amount" placeholder="Jumlah Koin">
      <input type="number" class="form-control balance" placeholder="Saldo akun (USD)">
      <input type="number" class="form-control risk" placeholder="Risk % per trade">
      <input type="number" class="form-control target" placeholder="Target harga jual (USD)">
      <div class="price mt-2">Harga real-time: ...</div>
      <div class="results mt-2"></div>
      <canvas class="chart chartjs mt-2"></canvas>
    </div>`;
  coinsContainer.appendChild(cardDiv);

  const ctx = cardDiv.querySelector('.chart').getContext('2d');
  charts[coin.id] = new Chart(ctx,{
    type:'line',
    data: { labels:[], datasets:[{ label: coin.symbol.toUpperCase(), data:[], borderColor:'#d35400', tension:0.3 }]},
    options:{responsive:true, maintainAspectRatio:false, animation:false, plugins:{legend:{display:false}}, scales:{x:{display:false}, y:{display:false}}}
  });
}

coins.forEach(createCoinCard);

async function getPrice(coinId){
  try{
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${coinId}&vs_currencies=usd`);
    const data = await res.json();
    return data[coinId]?.usd || 0;
  } catch(e){ return 0; }
}

async function updateDashboard(){
  const cards = document.querySelectorAll('#coins-container .card');
  for(let i=0;i<coins.length;i++){
    const card = cards[i];
    const coin = coins[i];
    const amount = parseFloat(card.querySelector('.amount').value);
    const balance = parseFloat(card.querySelector('.balance').value);
    const risk = parseFloat(card.querySelector('.risk').value);
    const target = parseFloat(card.querySelector('.target').value);
    const currentPrice = await getPrice(coin.id);

    card.querySelector('.price').innerText = `Harga real-time ${coin.symbol.toUpperCase()}: $${currentPrice}`;

    const chart = charts[coin.id];
    if(chart.data.labels.length>20){ chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
    chart.data.labels.push(new Date().toLocaleTimeString());
    chart.data.datasets[0].data.push(currentPrice);
    chart.update();

    if(isNaN(amount) || isNaN(balance) || isNaN(risk) || isNaN(target) || currentPrice===0){
      card.querySelector('.results').innerText='';
      continue;
    }

    const totalBuy = currentPrice*amount;
    const totalSell = target*amount;
    const profit = (totalSell - totalBuy)*(1-fee);
    const profitPercent = ((totalSell - totalBuy)/totalBuy)*100;
    const maxLoss = balance*(risk/100);
    const positionSize = maxLoss / Math.abs(currentPrice - target);

    const resultsText =
`Total Beli       : $${totalBuy.toFixed(2)}
Total Jual       : $${totalSell.toFixed(2)}
Profit/Loss      : $${profit.toFixed(2)} (${profitPercent.toFixed(2)}%)
Max Position Size : ${positionSize.toFixed(4)} koin sesuai risk`;

    const resultsDiv = card.querySelector('.results');
    resultsDiv.innerText = resultsText;
    resultsDiv.style.color = profit>=0 ? '#27ae60' : '#c0392b';
  }
}

// Jalankan pertama kali dan setiap detik
updateDashboard();
setInterval(updateDashboard,1000);
document.querySelectorAll('#coins-container').forEach(c=>c.addEventListener('input',updateDashboard));

// Theme toggle
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  if(isDark){
    document.body.style.background = '#ffffff';
    document.body.style.color = '#111';
    document.querySelectorAll('.card').forEach(c => c.style.background = 'rgba(0,0,0,0.05)');
    Object.values(charts).forEach(c => c.data.datasets[0].borderColor = '#d35400');
    isDark = false;
  } else {
    document.body.style.background = '#121212';
    document.body.style.color = '#fff';
    document.querySelectorAll('.card').forEach(c => c.style.background = 'rgba(255,255,255,0.05)');
    Object.values(charts).forEach(c => c.data.datasets[0].borderColor = '#f8c291');
    isDark = true;
  }
});
</script>
</body>
</html>
