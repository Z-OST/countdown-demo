
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Our Love Bubbles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, Helvetica, sans-serif;
    }

    .bubble {
      position: absolute;
      bottom: 0;
      padding: 8px 14px;
      border-radius: 20px;
      color: #fff;
      font-weight: bold;
      white-space: nowrap;
      animation: rise 5s linear forwards;
      opacity: 0.9;
      pointer-events: none;
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-500px) scale(1.2); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Our Love Bubbles 💖</h1>
  </div>

  <script>
    const messages = [
      "Aku sayang kamu 💕",
      "Selamanya kita 😘",
      "Kamu spesial 🌸",
      "Cinta kita abadi ❤️",
      "Kamu membuatku bahagia 😊",
      "Kamu segalanya 🌹"
    ];

    function createBubble() {
      const bubble = document.createElement('div');
      bubble.classList.add('bubble');

      // Pilih teks random
      bubble.innerText = messages[Math.floor(Math.random() * messages.length)];

      // Posisi horizontal random
      bubble.style.left = Math.random() * window.innerWidth + 'px';

      // Warna random
      const hue = Math.random() * 360;
      bubble.style.background = `hsl(${hue}, 70%, 60%)`;

      // Ukuran random
      const size = 12 + Math.random() * 10;
      bubble.style.fontSize = size + 'px';
      bubble.style.padding = (size/2) + 'px ' + size + 'px';

      document.body.appendChild(bubble);

      // Hapus bubble setelah animasi
      setTimeout(() => {
        bubble.remove();
      }, 5000);
    }

    // Buat bubble setiap 300ms
    setInterval(createBubble, 300);
  </script>
</body>
</html>
