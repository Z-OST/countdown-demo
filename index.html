
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond 💎 | Quick Trade ROI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#ffffff; font-family:Arial,sans-serif; padding:20px; color:#111; }
h1 { text-align:center; margin-bottom:20px; font-weight:bold; color:#333; }
.card { background:#f8f9fa; border-radius:15px; padding:20px; max-width:500px; margin:0 auto; box-shadow:0 5px 15px rgba(0,0,0,0.08); }
.card label { font-weight:bold; margin-top:10px; display:block; }
input { margin-bottom:10px; width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; }
input:focus { border-color:#3498db; outline:none; }
.results { white-space:pre-line; font-weight:bold; margin-top:10px; font-size:1rem; }
.signal { font-weight:bold; font-size:1.2rem; margin-top:10px; }
.signal.buy { color:#27ae60; }
.signal.sell { color:#c0392b; }
</style>
</head>
<body>
<div class="container">
<h1>💲</h1>
<div class="card">
  <label for="balance">Saldo Akun (USD)</label>
  <input type="number" step="0.01" id="balance" placeholder="Contoh: 500.25">

  <label for="invest">Jumlah Investasi (USD)</label>
  <input type="number" step="0.01" id="invest" placeholder="Contoh: 150.50">

  <label for="price">Harga Beli per Unit (USD)</label>
  <input type="number" step="0.0001" id="price" placeholder="Contoh: 10.75">

  <label for="target">Target Harga Jual per Unit (USD)</label>
  <input type="number" step="0.0001" id="target" placeholder="Contoh: 12.25">

  <div class="results"></div>
  <div class="signal"></div>
</div>
</div>

<script>
const fee = 0.001; // biaya trading
const balanceInput = document.getElementById('balance');
const investInput = document.getElementById('invest');
const priceInput = document.getElementById('price');
const targetInput = document.getElementById('target');
const resultsDiv = document.querySelector('.results');
const signalDiv = document.querySelector('.signal');

function calculate(){
  const balance = parseFloat(balanceInput.value);
  const invest = parseFloat(investInput.value);
  const price = parseFloat(priceInput.value);
  const target = parseFloat(targetInput.value);

  if([balance, invest, price, target].some(v => isNaN(v))) {
    resultsDiv.innerText='';
    signalDiv.innerText='';
    return;
  }

  const units = invest / price;
  const totalBuy = price * units;
  const totalSell = target * units;
  const profit = (totalSell - totalBuy)*(1-fee);
  const profitPercent = ((target - price)/price)*100;

  resultsDiv.innerText =
`Jumlah Unit        : ${units.toFixed(4)}
Total Beli         : $${totalBuy.toFixed(4)}
Total Jual Target  : $${totalSell.toFixed(4)}
Selisih / Kenaikan : ${profitPercent.toFixed(2)}%
Profit/Loss        : $${profit.toFixed(4)}
Max Risk Sesuai Saldo : $${(balance * 0.02).toFixed(4)} (2% contoh)`;

  if(target > price){
    signalDiv.innerText = `BUY ✅\nPotensi untung karena target > harga beli`;
    signalDiv.className = 'signal buy';
  } else {
    signalDiv.innerText = `SELL ⚠️\nTarget sudah tercapai atau harga sekarang >= target`;
    signalDiv.className = 'signal sell';
  }
}

// Update langsung tiap input berubah
[balanceInput, investInput, priceInput, targetInput].forEach(inp => inp.addEventListener('input', calculate));
</script>
</body>
</html>
