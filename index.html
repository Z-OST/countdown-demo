
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Our Love Bubbles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      color: white;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .bubble {
      position: fixed;
      bottom: 0;
      border-radius: 20px;
      color: #fff;
      font-weight: bold;
      white-space: normal; /* biar teks panjang wrap */
      word-wrap: break-word; /* biar teks panjang pecah */
      opacity: 0.9;
      pointer-events: none;
      animation: rise linear forwards;
      padding: 10px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      max-width: 80%; /* batasi lebar supaya muat layar */
    }

    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-550px) scale(1.05); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Our Love Bubbles 💖</h1>
  </div>

  <script>
    const messages = [
      "Aku sayang kamu lebih dari kata-kata yang bisa kuucapkan 💕",
      "Selamanya kita bersama, menghadapi semua suka dan duka 😘",
      "Kamu spesial untukku, lebih dari apapun di dunia ini 🌸",
      "Cinta kita abadi, melewati setiap detik, menit, dan hari ❤️",
      "Kamu membuatku bahagia setiap saat, bahkan saat jauh 😊",
      "Kamu segalanya bagiku, tak tergantikan, tak terbatas 🌹",
      "Setiap senyummu membuat hatiku meledak dengan cinta 💖",
      "Bersamamu, setiap hari terasa seperti mimpi yang indah ✨"
    ];

    const activeBubbles = [];
    const maxBubbles = 12; // lebih sedikit supaya rapi
    const bubbleSpacing = 50; // jarak horizontal minimal

    function createBubble() {
      if (activeBubbles.length >= maxBubbles) return;

      const bubble = document.createElement('div');
      bubble.classList.add('bubble');

      // teks random
      bubble.innerText = messages[Math.floor(Math.random() * messages.length)];

      // ukuran font random
      const size = 14 + Math.random() * 6;
      bubble.style.fontSize = size + 'px';
      bubble.style.padding = (size/2) + 'px ' + size + 'px';

      // warna random
      const hue = Math.random() * 360;
      bubble.style.background = `hsl(${hue}, 70%, 60%)`;

      // posisi horizontal aman
      let left;
      let tries = 0;
      do {
        left = 10 + Math.random() * (window.innerWidth - bubble.offsetWidth - 20);
        tries++;
      } while (activeBubbles.some(b => Math.abs(b.left - left) < bubbleSpacing) && tries < 20);
      bubble.style.left = left + 'px';
      bubble.left = left;

      // durasi animasi lebih lambat → lebih mudah dibaca
      const duration = 8 + Math.random() * 4; // 8-12 detik
      bubble.style.animationDuration = duration + 's';

      document.body.appendChild(bubble);
      activeBubbles.push(bubble);

      // hapus bubble setelah animasi selesai
      setTimeout(() => {
        bubble.remove();
        const index = activeBubbles.indexOf(bubble);
        if (index > -1) activeBubbles.splice(index, 1);
      }, duration * 1000);
    }

    // buat bubble tiap 1200ms → lebih santai
    setInterval(createBubble, 1200);
  </script>
</body>
</html>
