
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Crypto Dashboard Single Box</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#ffffff; color:#111; font-family: Arial,sans-serif; padding:20px; transition: background 0.3s, color 0.3s; }
h1 { text-align:center; margin-bottom:20px; color:#333; }
.card { background: rgba(0,0,0,0.05); border-radius:15px; padding:20px; max-width:500px; margin:0 auto; color:#111; transition: background 0.3s, color 0.3s;}
.card label { font-weight:bold; margin-top:10px; display:block; }
input { margin-bottom:10px; width:100%; }
.results { white-space:pre-line; font-weight:bold; color:#d35400; margin-top:10px; }
#themeToggle { display:block; margin:20px auto 0; }
</style>
</head>
<body>
<div class="container">
<h1>Pro Crypto Dashboard 💎</h1>

<div class="card">
  <label for="coin">Koin (Symbol)</label>
  <input type="text" id="coin" placeholder="Contoh: BTC, ETH">
  
  <label for="amount">Jumlah Koin</label>
  <input type="number" id="amount" placeholder="Jumlah koin yang dimiliki">
  
  <label for="balance">Saldo Akun (USD)</label>
  <input type="number" id="balance" placeholder="Saldo akun">
  
  <label for="risk">Risk % per Trade</label>
  <input type="number" id="risk" placeholder="Risk per trade (%)">
  
  <label for="target">Target Harga Jual (USD)</label>
  <input type="number" id="target" placeholder="Target harga jual">
  
  <div class="price mt-2">Harga real-time: ...</div>
  <div class="results mt-2"></div>
</div>

<button id="themeToggle" class="btn btn-secondary">Ganti Tema</button>
</div>

<script>
const fee = 0.001;
const coinInput = document.getElementById('coin');
const amountInput = document.getElementById('amount');
const balanceInput = document.getElementById('balance');
const riskInput = document.getElementById('risk');
const targetInput = document.getElementById('target');
const priceDiv = document.querySelector('.price');
const resultsDiv = document.querySelector('.results');
let isDark = false;

// Ambil harga real-time dari CoinGecko
async function getPrice(symbol){
  try{
    const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${symbol.toLowerCase()}&vs_currencies=usd`);
    const data = await res.json();
    return data[symbol.toLowerCase()]?.usd || 0;
  } catch(e){ return 0; }
}

async function updateDashboard(){
  const coin = coinInput.value.trim();
  if(!coin) return;

  const amount = parseFloat(amountInput.value);
  const balance = parseFloat(balanceInput.value);
  const risk = parseFloat(riskInput.value);
  const target = parseFloat(targetInput.value);

  const currentPrice = await getPrice(coin);
  priceDiv.innerText = `Harga real-time ${coin.toUpperCase()}: $${currentPrice}`;

  if(isNaN(amount) || isNaN(balance) || isNaN(risk) || isNaN(target) || currentPrice===0){
    resultsDiv.innerText='';
    return;
  }

  const totalBuy = currentPrice*amount;
  const totalSell = target*amount;
  const profit = (totalSell - totalBuy)*(1-fee);
  const profitPercent = ((totalSell - totalBuy)/totalBuy)*100;
  const maxLoss = balance*(risk/100);
  const positionSize = maxLoss / Math.abs(currentPrice - target);

  resultsDiv.innerText =
`Total Beli       : $${totalBuy.toFixed(2)}
Total Jual       : $${totalSell.toFixed(2)}
Profit/Loss      : $${profit.toFixed(2)} (${profitPercent.toFixed(2)}%)
Max Position Size : ${positionSize.toFixed(4)} koin sesuai risk`;

  resultsDiv.style.color = profit>=0 ? '#27ae60' : '#c0392b';
}

// Update otomatis saat input berubah
[coinInput, amountInput, balanceInput, riskInput, targetInput].forEach(inp => inp.addEventListener('input', updateDashboard));

// Jalankan setiap 1 detik untuk update harga
setInterval(updateDashboard,1000);

// Toggle tema
const themeToggle = document.getElementById('themeToggle');
themeToggle.addEventListener('click', () => {
  if(isDark){
    document.body.style.background = '#ffffff';
    document.body.style.color = '#111';
    document.querySelector('.card').style.background = 'rgba(0,0,0,0.05)';
    isDark = false;
  } else {
    document.body.style.background = '#121212';
    document.body.style.color = '#fff';
    document.querySelector('.card').style.background = 'rgba(255,255,255,0.05)';
    isDark = true;
  }
});
</script>
</body>
</html>
