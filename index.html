
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond 💎 | Binance Live</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#fff; font-family:Arial,sans-serif; padding:20px; color:#111; }
h1 { text-align:center; margin-bottom:20px; font-weight:bold; color:#333; }
.card { background:#f8f9fa; border-radius:15px; padding:20px; max-width:500px; margin:0 auto; box-shadow:0 5px 15px rgba(0,0,0,0.08); }
.card label { font-weight:bold; margin-top:10px; display:block; }
input { margin-bottom:10px; width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; }
input:focus { border-color:#3498db; outline:none; }
.results { white-space:pre-line; font-weight:bold; margin-top:10px; font-size:1rem; }
.price { margin-top:5px; font-style:italic; color:#555; }
</style>
</head>
<body>
<div class="container">
<h1>Diamond 💎</h1>
<div class="card">
  <label for="coin">Koin (Symbol Binance, Contoh: BTCUSDT)</label>
  <input type="text" id="coin" placeholder="Contoh: BTCUSDT">
  
  <label for="amount">Jumlah Koin</label>
  <input type="number" id="amount" placeholder="Jumlah koin yang dimiliki">
  
  <label for="balance">Saldo Akun (USD)</label>
  <input type="number" id="balance" placeholder="Saldo akun">
  
  <label for="risk">Risk % per Trade</label>
  <input type="number" id="risk" placeholder="Risk per trade (%)">
  
  <label for="target">Target Harga Jual (USD)</label>
  <input type="number" id="target" placeholder="Target harga jual">
  
  <div class="price">Harga real-time: ...</div>
  <div class="results"></div>
</div>
</div>

<script>
const fee = 0.001;
const coinInput = document.getElementById('coin');
const amountInput = document.getElementById('amount');
const balanceInput = document.getElementById('balance');
const riskInput = document.getElementById('risk');
const targetInput = document.getElementById('target');
const priceDiv = document.querySelector('.price');
const resultsDiv = document.querySelector('.results');

let ws;

function connectWebSocket(symbol){
  if(ws) ws.close();
  if(!symbol) return;

  ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol.toLowerCase()}@trade`);
  
  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    const price = parseFloat(data.p);
    priceDiv.innerText = `Harga real-time ${symbol.toUpperCase()}: $${price}`;
    calculate(price);
  }
}

function calculate(currentPrice){
  const amount = parseFloat(amountInput.value);
  const balance = parseFloat(balanceInput.value);
  const risk = parseFloat(riskInput.value);
  const target = parseFloat(targetInput.value);

  if(isNaN(amount) || isNaN(balance) || isNaN(risk) || isNaN(target) || isNaN(currentPrice)) {
    resultsDiv.innerText='';
    return;
  }

  const totalBuy = currentPrice*amount;
  const totalSell = target*amount;
  const profit = (totalSell - totalBuy)*(1-fee);
  const profitPercent = ((totalSell - totalBuy)/totalBuy)*100;
  const maxLoss = balance*(risk/100);
  const positionSize = maxLoss / Math.abs(currentPrice - target);

  resultsDiv.innerText =
`Total Beli       : $${totalBuy.toFixed(2)}
Total Jual       : $${totalSell.toFixed(2)}
Profit/Loss      : $${profit.toFixed(2)} (${profitPercent.toFixed(2)}%)
Max Position Size : ${positionSize.toFixed(4)} koin sesuai risk`;

  resultsDiv.style.color = profit>=0 ? '#27ae60' : '#c0392b';
}

// Event input
[coinInput, amountInput, balanceInput, riskInput, targetInput].forEach(inp => {
  inp.addEventListener('input', () => {
    connectWebSocket(coinInput.value.trim());
  });
});
</script>
</body>
</html>
