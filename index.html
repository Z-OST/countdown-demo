<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Art Quote Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:#f6f5f2;color:#1e1e1e;padding:40px;}
h1{text-align:center;margin-bottom:20px;font-family:'Playfair Display',serif;font-weight:500;font-size:36px;color:#1e1e1e;}
#heroText{font-family:'Playfair Display',serif;font-size:24px;text-align:center;margin-bottom:20px;min-height:60px;transition:opacity .5s;}
#categoryBar{display:flex;justify-content:center;gap:20px;margin-bottom:40px;}
.categoryBtn{padding:10px 20px;border-radius:12px;border:none;cursor:pointer;background:#e0e0e0;font-family:'Playfair Display',serif;font-size:16px;transition:background .3s;}
.categoryBtn.active, .categoryBtn:hover{background:#1e1e1e;color:#fff;}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;overflow-y:auto;max-height:70vh;opacity:0;pointer-events:none;transition:opacity .5s;}
.card{background:#ffffff;padding:30px;border-radius:18px;cursor:pointer;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;transition:transform .5s ease,opacity .5s ease;opacity:0;transform:translateY(40px);}
.card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 15px 40px rgba(0,0,0,0.08);}
.card p{font-family:'Playfair Display',serif;font-size:16px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;}
.overlay{position:fixed;inset:0;background:#ffffff;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s ease;padding:20px;}
.overlay.active{opacity:1;pointer-events:auto;}
.quote-box{max-width:800px;padding:60px 50px;text-align:center;animation:fadeScale .5s ease;overflow-y:auto;max-height:90vh;}
.quote-box p{font-family:'Playfair Display',serif;font-size:32px;line-height:1.6;color:#1e1e1e;}
.watermark{margin-top:40px;font-size:12px;opacity:0.3;font-family:'Inter',sans-serif;}
@keyframes fadeScale{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}
@media(max-width:600px){.quote-box p{font-size:24px;}#heroText{font-size:20px;}}
</style>
</head>
<body>

<h1>Art Quote Gallery</h1>
<div id="heroText">Selamat datang di Art Quote Gallery…</div>

<div id="categoryBar">
  <button class="categoryBtn" data-cat="Love">Love</button>
  <button class="categoryBtn" data-cat="Heartbreak">Heartbreak</button>
  <button class="categoryBtn" data-cat="Friendship">Friendship</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="overlay" id="overlay">
  <div class="quote-box">
    <p id="bigQuote"></p>
    <div class="watermark">Art Quote Gallery · 2026</div>
  </div>
</div>

<script>
// Hero text rotasi
const heroTexts = [
  "Di dunia yang penuh kebohongan, bahkan hati dan cinta saja diperhitungkan.",
  "Kadang diam adalah jawaban terbaik.",
  "Cinta datang tanpa alasan, tapi pergi juga tanpa alasan.",
  "Hidup kadang berat, tapi jangan berhenti melangkah.",
  "Setiap hari adalah halaman baru untuk kita tulis."
];
let heroIndex = 0;
const heroEl = document.getElementById('heroText');
setInterval(()=>{
  heroEl.style.opacity='0';
  setTimeout(()=>{
    heroIndex = (heroIndex+1)%heroTexts.length;
    heroEl.textContent = heroTexts[heroIndex];
    heroEl.style.opacity='1';
  },500);
},5000);

// Quotes per kategori
const quotes = {
  Love:[ /* 12 quotes Love */ "Di dunia yang penuh kebohongan...", "Aku selalu berharap...", "Aku bertahan bukan karena kuat...", "Ada rasa yang gak butuh dibalas...", "Tenang bukan berarti sembuh...", "Cinta bukan soal memiliki...", "Jangan menunggu bahagia...", "Cinta datang tanpa alasan...", "Kita tak perlu sempurna...", "Senyum itu sederhana...", "Tetaplah berani...", "Cinta sejati terlihat dari perhatian kecil."],
  Heartbreak:[ /* 5 quotes Heartbreak */ "Dongeng dengan akhir yang tidak jelas...", "Aku capek, tapi masih pengen hidup.", "Hidup kadang berat...", "Jangan takut jatuh...", "Kadang diam adalah jawaban terbaik."],
  Friendship:[ /* 5 quotes Friendship */ "Beberapa hal patah supaya kita berhenti menggenggam.", "Persahabatan adalah harta...", "Berhenti menyesal...", "Berani berbeda...", "Kepercayaan dibangun, bukan dipaksakan."]
};

const gallery = document.getElementById('gallery');
const overlay = document.getElementById('overlay');
const bigQuote = document.getElementById('bigQuote');

// Intersection Observer
const observer = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.style.opacity='1';
      entry.target.style.transform='translateY(0)';
    } else {
      entry.target.style.opacity='0';
      entry.target.style.transform='translateY(40px)';
    }
  });
},{threshold:0.2});

// Render quotes (grid muncul setelah klik kategori)
function renderQuotes(category){
  gallery.innerHTML='';
  gallery.style.opacity='1';
  gallery.style.pointerEvents='auto';
  quotes[category].forEach(q=>{
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<p>${q}</p>`;
    gallery.appendChild(div);
    observer.observe(div);
    div.addEventListener('click',()=>{bigQuote.textContent=q; overlay.classList.add('active');});
  });
}

// Kategori tombol
const buttons = document.querySelectorAll('.categoryBtn');
buttons.forEach(btn=>{
  btn.addEventListener('click',()=>{
    buttons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderQuotes(btn.dataset.cat);
  });
});

// klik overlay close
overlay.addEventListener('click',()=>overlay.classList.remove('active'));
</script>

</body>
</html>
